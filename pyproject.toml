[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectralab"
version = "0.1.0"
description = "Generative modelling of experimental perovskite thin-film absorption spectra with physically interpretable representations"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "matplotlib>=3.8", "scikit-learn>=1.4", "torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

