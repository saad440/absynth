[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "absynth"
version = "0.1.0"
description = "Generative modelling of experimental perovskite thin-film absorption spectra with physically interpretable representations"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "matplotlib>=3.8", "scikit-learn>=1.4", "torch>=2.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Notebooks carry setup-cell imports whose uses span later cells, and
# notebooks are assembled incrementally. Unused-import noise is
# tolerated there; real problems (undefined names, etc.) still checked.
"notebooks/**" = ["F401"]

